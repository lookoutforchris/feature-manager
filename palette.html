<html>
    <head>
        <style>
            html,
            body {
                background: transparent;
            }
            body {
                font-family: Arial, Helvetica, sans-serif;
                font-size: 12px;
                margin: 0;
            }
            body.dragging-history-marker {
                cursor: ns-resize;
                user-select: none;
            }
            body.dragging-feature {
                cursor: ns-resize;
                user-select: none;
            }
            #content {
                background: transparent;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                min-height: 95vh;
                margin-left: 0px;
                margin-right: 0px;
            }
            #message:empty {
                display: none;
            }
            .feature {
                align-items: center;
                background-color: transparent;
                box-sizing: border-box;
                color: #ffffff;
                display: flex;
                list-style-type: none;
                margin: 1px 0;
                min-height: 26px;
                max-width: calc(100% - 12px);
                overflow: hidden;
                padding-left: 5px;
                padding-right: 5px;
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.75);
                width: max-content;
                white-space: nowrap;
            }
            .feature:hover .feature-label {
                background-color: #3f4a5d;
            }
            .feature.selected .feature-label {
                background-color: #3f4a5d;
            }
            .feature.context-menu-source .feature-label {
                background-color: #3f4a5d;
            }
            .feature.drag-source {
                opacity: 0.5;
            }
            .context-menu {
                background-color: #46546a;
                border: 1px solid #2f3b4e;
                box-sizing: border-box;
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
                color: white;
                display: none;
                font-size: 14px;
                width: 300px;
                padding: 4px 0;
                position: fixed;
                z-index: 1000;
            }
            .context-menu.visible {
                display: block;
            }
            .context-menu-item {
                align-items: center;
                cursor: default;
                display: grid;
                grid-template-columns: 24px 1fr auto;
                gap: 8px;
                line-height: 22px;
                padding: 2px 10px;
                white-space: nowrap;
            }
            .context-menu-item:hover {
                background-color: #5d6c84;
            }
            .context-menu-item.disabled {
                color: #b7bfca;
            }
            .context-menu-item.disabled:hover {
                background-color: transparent;
            }
            .context-menu-separator {
                border-top: 1px solid #b7bfca;
                margin: 4px 6px;
            }
            .context-menu-icon {
                color: #c8d6eb;
                text-align: center;
            }
            .context-menu-icon img {
                height: 16px;
                max-width: 16px;
                vertical-align: middle;
                width: 16px;
            }
            .context-menu-shortcut {
                padding-left: 24px;
            }
            .marker-drop-zone {
                height: 10px;
                list-style-type: none;
                position: relative;
            }
            .marker-drop-zone:hover {
                background-color: transparent;
            }
            .marker-drop-zone.drag-over {
                background-color: transparent;
            }
            body.dragging-feature .marker-drop-zone {
                height: 16px;
            }
            body.dragging-feature .marker-drop-zone.final-marker-drop-zone {
                height: 64px;
            }
            body.dragging-feature .marker-drop-zone.drag-over {
                background-color: transparent;
            }
            body.dragging-feature .marker-drop-zone.drag-over::after {
                content: "";
                position: absolute;
                left: 0;
                right: 0;
                top: 7px;
                height: 2px;
                background-color: #2b7cff;
            }
            .history-marker {
                display: block;
                position: absolute;
                left: 0;
                right: 0;
                top: 4px;
                height: 2px;
                background-color: #2b7cff;
                cursor: ns-resize;
            }
            .history-marker::before {
                content: "";
                position: absolute;
                left: 0;
                top: -6px;
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background-color: #2b7cff;
            }
            .marker-drop-zone:hover .history-marker,
            .marker-drop-zone.drag-over .history-marker {
                background-color: #6fb0ff;
            }
            .marker-drop-zone:hover .history-marker::before,
            .marker-drop-zone.drag-over .history-marker::before {
                background-color: #6fb0ff;
            }
            .feature-group-header {
                padding-left: 4px;
                padding-right: 4px;
            }
            .feature-group-header.collapsed {
                border-bottom: none;
            }
            .feature-group {
                padding-left: 30px;
            }
            .feature-group.collapsed {
                display: none;
            }
            .group-toggle {
                align-items: center;
                display: inline-flex;
                cursor: pointer;
                justify-content: center;
                height: 22px;
                line-height: 20px;
                text-align: center;
                vertical-align: middle;
                width: 22px;
            }
            .group-toggle img {
                height: 10px;
                width: 10px;
            }
            .parents-container, .group-toggle {
                min-width: 22px;
            }
            .parents-container {
                display: inline-block;
            }
            .parent-bar {
                display: inline-block;
                width: 3px;
                height: 16px;
                vertical-align: middle;
                margin-right: 2px;
            }
            .icon {
                width: 16px;
                height: 16px;
                vertical-align: middle;
                padding: 2px;
            }
            .feature-label {
                align-items: center;
                display: inline-flex;
                min-height: 24px;
                padding-right: 6px;
            }
            .feature-group-header .icon {
                cursor: pointer;
                filter: brightness(0) saturate(100%) invert(69%) sepia(67%) saturate(896%) hue-rotate(165deg) brightness(96%) contrast(88%);
            }
            .name {
                margin-left: 5px;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .name:hover {
                outline: 1px solid silver;
            }
            .name:focus {
                background-color: white;
                color: #111111;
                outline: none;
            }
            .suppressed .feature-label {
                opacity: 0.5;
            }
            .suppressed.feature-group-header .feature-label {
                opacity: 1;
            }
            .suppressed.feature-group-header .name {
                opacity: 0.5;
            }
            ul {
                margin: 0;
                padding-left: 0px;
            }
        </style>
    </head>
    <body>
        <div id="content">
            <div>
                <div id="message">
                    Loading...
                </div>
                <div id="timeline">
                    
                </div>
            </div>
        </div>
        <div id="context-menu" class="context-menu"></div>
    </body>
    <script>
    // Can't access the colors from Fusion, so making up our own
    const COMPONENT_COLORS = [
        '#e79f53',
        '#4a51d7',
        '#6bfcdd',
        '#54d8f7',
    ];
    var colorMap = {};
    var nextColor = 0;

    var collapsedGroups = new Set();

    var cancelingEdit = false;
    var readySent = false;
    var draggingMarker = false;
    var activeMarkerDropZone = null;
    var lastTimelineData = null;
    var menuIcons = {};
    var contextMenuFeature = null;
    var selectedFeatureIds = new Set();
    var lastSelectedFeatureId = null;
    var draggedFeatureId = null;
    var draggedFeatureItem = null;
    var pendingFeatureDrag = null;
    var suppressNextFeatureClick = false;

    window.fusionJavaScriptHandler = {handle: function(action, jsonData){
        console.log("Got command:", action);
        data = JSON.parse(jsonData);
        return handle(action, data);
    }};

    function handle(action, data) {
        try {
            switch (action) {
                case 'setTimeline':
                    let previousTimelineData = lastTimelineData;
                    if (previousTimelineData &&
                        previousTimelineData['marker-position'] != data['marker-position']) {
                        clearFeatureSelection();
                        hideContextMenu();
                    }
                    lastTimelineData = data;
                    menuIcons = data['menu-icons'] || {};
                    let message = document.getElementById('message');
                    message.innerText = data['message'];
                    message.style.display = data['message'] ? 'block' : 'none';

                    let timeline = document.getElementById('timeline');
                    timeline.innerHTML = '';
                    appendItems(timeline,
                                data['features'],
                                data['max-parents'],
                                data['marker-position'],
                                data['timeline-count']);

                    break;
                case 'debugger':
                    debugger;
                    break;
            }
        } catch (e) {
            console.log(e);
            console.log('exception caught with action: ' + action + ', data: ' + data);
            return 'FAILED';
        }
        return 'OK';
    }

    function appendItems(parent, features, maxParents, markerPosition, finalMarkerPosition=null, isGroup=false, markerRenderState=null, blockedMarkerPositions=null) {
        if (markerRenderState === null) {
            markerRenderState = { activeMarkerRendered: false };
        }
        if (blockedMarkerPositions === null) {
            blockedMarkerPositions = new Set();
        }
        let list = document.createElement('ul');
        if (isGroup) {
            list.classList.add('feature-group');
        }
        let firstRolledBack = true;
        let renderedMarkerPositions = new Set();
        let nestedMarkerPositions = new Set();
        for (const feature of features) {
            if (!blockedMarkerPositions.has(feature['marker-position']) &&
                !renderedMarkerPositions.has(feature['marker-position']) &&
                !nestedMarkerPositions.has(feature['marker-position'])) {
                appendMarkerDropZone(list, feature['marker-position'], markerPosition, markerRenderState);
                renderedMarkerPositions.add(feature['marker-position']);
            }

            let listItem = document.createElement('li');
            listItem.classList.add('feature');
            let isAfterMarker = markerPosition !== null && feature['marker-position'] >= markerPosition;
            let isRolledBack = feature.rolledBack || isAfterMarker;
            if (feature.suppressed || isRolledBack) {
                listItem.classList.add('suppressed');
                if (isRolledBack && firstRolledBack) {
                    firstRolledBack = false;
                    listItem.classList.add('first-rolled-back');
                }
            }
            listItem.setAttribute('data-id', feature['id']);
            listItem.setAttribute('data-name', feature.name);
            listItem.setAttribute('data-suppressed', feature.suppressed ? 'true' : 'false');
            listItem.setAttribute('data-type', feature.type);
            if (selectedFeatureIds.has(String(feature['id']))) {
                listItem.classList.add('selected');
            }

            listItem.addEventListener('click', onFeatureClick);
            listItem.addEventListener('dblclick', onFeatureDoubleClick);
            listItem.addEventListener('contextmenu', onFeatureContextMenu);
            listItem.addEventListener('mousedown', onFeatureMouseDown);

            if (feature['edit-name']) {
                listItem.setAttribute('data-edit-name', feature['edit-name']);
            }

            let titlePrefix = '';
            let groupToggle;
            if (feature.type == 'GROUP') {
                groupToggle = document.createElement('span');
                groupToggle.classList.add('group-toggle');
                listItem.setAttribute('data-expanded-image', feature['expanded-image']);
                listItem.setAttribute('data-collapsed-image', feature['collapsed-image']);
                let groupToggleImage = document.createElement('img');
                groupToggleImage.src = feature.collapsed ? feature['collapsed-image'] : feature['expanded-image'];
                groupToggle.appendChild(groupToggleImage);
                listItem.appendChild(groupToggle);
            } else {
                let parents = feature['parent-components'];
                if (parents && parents.length > 0) {
                    titlePrefix = `Component: ${parents[0]}\n\n`;
                }
                addParentBars(listItem, feature, maxParents);
            }
            listItem.title = titlePrefix.trim();

            let label = document.createElement('span');
            label.classList.add('feature-label');
            listItem.appendChild(label);

            let image = document.createElement('img');
            image.src = feature['image'];
            image.classList.add('icon');
            label.appendChild(image);

            let name = document.createElement('span');
            name.classList.add('name');
            name.innerText = feature.name;
            name.contentEditable = true;
            name.addEventListener('keydown', onFeatureNameClick);
            name.addEventListener('blur', onFeatureNameBlur);
            name.addEventListener('focus', onFeatureNameFocus);
            label.appendChild(name);

            // The browser seems to send click to the rightmost span,
            // when clicking outside any span. Add this span to avoid
            // clicks on the right side going to "name".
            let endFill = document.createElement('span');
            endFill.innerHTML = '&nbsp;';
            listItem.appendChild(endFill);

            list.appendChild(listItem);
            if (feature.type == 'GROUP') {
                nestedMarkerPositions.add(feature['marker-position']);
                listItem.classList.add('feature-group-header');
                listItem.title = 'Group';
                listItem.setAttribute('data-collapsed', feature.collapsed);

                let groupBlockedMarkerPositions = new Set([feature['marker-position']]);
                let groupList = appendItems(list, feature.children, maxParents, markerPosition, feature['marker-after-position'], true, markerRenderState, groupBlockedMarkerPositions);
                let toggleGroup = (event) => {
                    setGroupCollapsed(listItem, groupList, !isGroupCollapsed(listItem));
                    event.preventDefault();
                    event.stopPropagation();
                };
                groupToggle.addEventListener('click', toggleGroup);
                image.addEventListener('click', toggleGroup);
                if (feature.collapsed || collapsedGroups.has(feature.name)) {
                    listItem.classList.add('collapsed');
                    groupToggle.classList.add('collapsed');
                    groupList.classList.add('collapsed');
                    listItem.setAttribute('data-collapsed', true);
                }
            }
        }
        if (!isGroup &&
            finalMarkerPosition !== null &&
            !renderedMarkerPositions.has(finalMarkerPosition) &&
            !nestedMarkerPositions.has(finalMarkerPosition)) {
            appendMarkerDropZone(list, finalMarkerPosition, markerPosition, markerRenderState, true);
        }
        parent.appendChild(list);
        return list;
    }

    function appendMarkerDropZone(parent, position, markerPosition, markerRenderState, isFinal=false) {
        let markerDropZone = document.createElement('li');
        markerDropZone.classList.add('marker-drop-zone');
        if (isFinal) {
            markerDropZone.classList.add('final-marker-drop-zone');
        }
        markerDropZone.setAttribute('data-position', position);
        markerDropZone.title = `Move history marker to position ${position}`;

        markerDropZone.addEventListener('dragover', onMarkerDragOver);
        markerDropZone.addEventListener('dragleave', onMarkerDragLeave);
        markerDropZone.addEventListener('drop', onMarkerDrop);
        if (position == markerPosition && !markerRenderState.activeMarkerRendered) {
            markerDropZone.appendChild(createHistoryMarker());
            markerRenderState.activeMarkerRendered = true;
        }

        parent.appendChild(markerDropZone);
    }

    function createHistoryMarker() {
        let marker = document.createElement('span');
        marker.classList.add('history-marker');
        marker.addEventListener('mousedown', onMarkerMouseDown);
        return marker;
    }

    function addParentBars(item, feature, maxParents) {
        let parentBars = document.createElement('span');
        parentBars.classList.add('parents-container');
        parentBars.style.width = maxParents * (3 + 2) + 'px';
        item.appendChild(parentBars);

        let parents = feature['parent-components'];
        if (!parents) {
            return;
        }
        for (const parent of parents) {
            let parentBar = document.createElement('span');
            parentBar.classList.add('parent-bar')
            parentBar.title = parent;
            color = colorMap[parent];
            if (!color) {
                if (nextColor >= COMPONENT_COLORS.length) {
                    color = 'silver';
                } else {
                    color = COMPONENT_COLORS[nextColor];
                    colorMap[parent] = color;
                    nextColor++;
                }
            }
            parentBar.style.backgroundColor = color;
            parentBars.appendChild(parentBar);
        }
    }

    function onFeatureNameClick(e) {
        let item = e.target.closest('.feature');
        ESC_KEY = 27;
        ENTER_KEY = 13;
        if (e.which == ESC_KEY) {
            cancelingEdit = true;
            e.target.blur();
            e.preventDefault();
        } else if (e.which == ENTER_KEY) {
            e.target.blur();
            e.preventDefault();
        }
        e.stopPropagation();
    }

    function onFeatureNameBlur(e) {
        let item = e.target.closest('.feature');

        if (cancelingEdit) {
            cancelingEdit = false;
            item.querySelector('.name').innerText = item.getAttribute('data-name');
            return;
        }

        storeFeatureName(item);
    }

    function onFeatureNameFocus(e) {
        let item = e.target.closest('.feature');

        if (item.hasAttribute('data-edit-name')) {
            item.querySelector('.name').innerText = item.getAttribute('data-edit-name');
        }

        let range = document.createRange();
        range.selectNodeContents(e.target);
        let sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
    }

    function onFeatureClick(e) {
        if (suppressNextFeatureClick) {
            suppressNextFeatureClick = false;
            e.preventDefault();
            e.stopPropagation();
            return;
        }
        let item = e.target.closest('.feature');
        if (!item.classList.contains('feature')) {
            return;
        }

        updateFeatureSelection(item, e.ctrlKey || e.metaKey, e.shiftKey);
        let ret = query('selectFeatures', { 'ids': getSelectedFeatureIds() } );
        processCommands(ret);
    }

    function onFeatureDoubleClick(e) {
        let item = e.target.closest('.feature');

        let ret = query('editFeature', { 'id': parseInt(item.getAttribute('data-id')) } );
        processCommands(ret);
    }

    function getFeatureItems() {
        return Array.from(document.querySelectorAll('.feature'));
    }

    function getSelectedFeatureIds() {
        return Array.from(selectedFeatureIds).map(id => parseInt(id));
    }

    function setSelectedFeatureIds(ids) {
        selectedFeatureIds = new Set(ids.map(id => String(id)));
        for (const feature of getFeatureItems()) {
            feature.classList.toggle('selected', selectedFeatureIds.has(feature.getAttribute('data-id')));
        }
        if (ids.length > 0) {
            lastSelectedFeatureId = String(ids[ids.length - 1]);
        }
    }

    function clearFeatureSelection() {
        selectedFeatureIds.clear();
        lastSelectedFeatureId = null;
        for (const feature of getFeatureItems()) {
            feature.classList.remove('selected');
        }
    }

    function updateFeatureSelection(item, ctrlKey, shiftKey) {
        let id = item.getAttribute('data-id');
        let items = getFeatureItems();

        if (shiftKey && lastSelectedFeatureId !== null) {
            let start = items.findIndex(feature => feature.getAttribute('data-id') == lastSelectedFeatureId);
            let end = items.indexOf(item);
            if (start >= 0 && end >= 0) {
                let first = Math.min(start, end);
                let last = Math.max(start, end);
                setSelectedFeatureIds(items.slice(first, last + 1).map(feature => feature.getAttribute('data-id')));
                return;
            }
        }

        if (ctrlKey) {
            let ids = new Set(selectedFeatureIds);
            if (ids.has(id)) {
                ids.delete(id);
            } else {
                ids.add(id);
            }
            setSelectedFeatureIds(Array.from(ids));
            lastSelectedFeatureId = id;
            return;
        }

        setSelectedFeatureIds([id]);
    }

    function onFeatureContextMenu(e) {
        if (isContextMenuVisible()) {
            hideContextMenu();
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
        let item = e.target.closest('.feature');
        if (!item) {
            hideContextMenu();
            return true;
        }

        if (!item.classList.contains('selected')) {
            setSelectedFeatureIds([item.getAttribute('data-id')]);
            let ret = query('selectFeatures', { 'ids': getSelectedFeatureIds() } );
            processCommands(ret);
        }
        showFeatureContextMenu(e, item);
        e.preventDefault();
        e.stopPropagation();
        return false;
    }

    function showFeatureContextMenu(e, item) {
        hideContextMenu();
        contextMenuFeature = item;
        contextMenuFeature.classList.add('context-menu-source');
        let menu = document.getElementById('context-menu');
        menu.innerHTML = '';

        let selectedCount = selectedFeatureIds.size;
        if (selectedCount > 1) {
            addMultiFeatureContextMenuItems(menu, selectedCount);
        } else if (item.getAttribute('data-type') == 'GROUP') {
            addGroupContextMenuItems(menu, item);
        } else if (isSketchItem(item)) {
            addSketchContextMenuItems(menu);
        } else {
            addFeatureContextMenuItems(menu, item);
        }

        menu.classList.add('visible');
        let rowBounds = item.getBoundingClientRect();
        let x = 125;
        let y = rowBounds.top + 12;
        if (x + menu.offsetWidth > window.innerWidth - 4) {
            x = Math.min(e.clientX + 12, window.innerWidth - menu.offsetWidth - 4);
        }
        if (y + menu.offsetHeight > window.innerHeight - 4) {
            y = window.innerHeight - menu.offsetHeight - 4;
        }
        menu.style.left = `${Math.max(0, x)}px`;
        menu.style.top = `${Math.max(0, y)}px`;
    }

    function addFeatureContextMenuItems(menu, item) {
        let suppressInfo = getSuppressionMenuInfo();
        let canEditProfileSketch = featureSupportsProfileSketch(item);
        addContextMenuItem(menu, menuIcon('create-selection-set'), 'Create Selection Set', () => executeFusionFeatureCommand('CreateSelectionGroupCmd'));
        addContextMenuSeparator(menu);
        addContextMenuItem(menu, getContextFeatureIcon(), 'Edit Feature', editContextFeature);
        addContextMenuItem(menu, menuIcon('edit-profile-sketch'), 'Edit Profile Sketch', () => executeFusionFeatureCommand('ProfileSketchActivate'), '', !canEditProfileSketch);
        addContextMenuItem(menu, menuIcon('configure'), 'Configure', () => executeFusionFeatureCommand('ConfigureFeatureCmd'));
        addContextMenuSeparator(menu);
        addContextMenuItem(menu, menuIcon('delete'), 'Delete', () => executeFusionFeatureCommand('FusionDeleteCommand'), 'Del');
        addContextMenuItem(menu, '', 'Rename', renameContextFeature);
        addContextMenuSeparator(menu);
        addContextMenuItem(menu, menuIcon('roll-marker'), 'Roll Timeline Marker Here', rollContextFeature);
        addContextMenuItem(menu, menuIcon('convert-dm'), 'Convert to DM Feature', () => executeFusionFeatureCommand('ConvertToDMFeatureCommand'));
        addContextMenuItem(menu, '', suppressInfo.label, () => setContextFeaturesSuppressed(suppressInfo.suppressed));
        addContextMenuSeparator(menu);
        addContextMenuItem(menu, menuIcon('find-browser'), 'Find in Browser', () => executeFusionFeatureCommand('FindInBrowser'));
        addContextMenuItem(menu, menuIcon('find-window'), 'Find in Window', () => executeFusionFeatureCommand('FindInWindow'));
    }

    function addSketchContextMenuItems(menu) {
        addContextMenuItem(menu, menuIcon('create-selection-set'), 'Create Selection Set', () => executeFusionFeatureCommand('CreateSelectionGroupCmd'));
        addContextMenuSeparator(menu);
        addContextMenuItem(menu, menuIcon('extrude'), 'Extrude', () => executeFusionFeatureCommand('Extrude'), 'E');
        addContextMenuItem(menu, menuIcon('offset-plane'), 'Offset Plane', () => executeFusionFeatureCommand('ConstructionPlaneOffsetFromPlaneCommand'));
        addContextMenuSeparator(menu);
        addContextMenuItem(menu, menuIcon('edit-sketch'), 'Edit Sketch', editContextFeature);
        addContextMenuItem(menu, menuIcon('redefine-sketch-plane'), 'Redefine Sketch Plane', () => executeFusionFeatureCommand('SketchRedefineCommand'));
        addContextMenuItem(menu, '', 'Select Sketch Plane', () => executeFusionFeatureCommand('SelectSketchPlaneCommand'));
        addContextMenuItem(menu, menuIcon('slice-sketch'), 'Slice Sketch', () => executeFusionFeatureCommand('SliceSketchCommand'));
        addContextMenuItem(menu, menuIcon('configure'), 'Configure', () => executeFusionFeatureCommand('ConfigureFeatureCmd'));
        addContextMenuSeparator(menu);
        addContextMenuItem(menu, menuIcon('export-dxf'), 'Export DXF', () => executeFusionFeatureCommand('SketchExportToDXFCommand'));
        addContextMenuItem(menu, menuIcon('delete'), 'Delete', () => executeFusionFeatureCommand('FusionDeleteCommand'), 'Del');
        addContextMenuItem(menu, '', 'Rename', renameContextFeature);
        addContextMenuSeparator(menu);
        addContextMenuItem(menu, menuIcon('look-at'), 'Look At', () => executeFusionFeatureCommand('LookAtCommand'));
        addContextMenuSeparator(menu);
        addContextMenuItem(menu, menuIcon('find-window'), 'Find in Window', () => executeFusionFeatureCommand('FindInWindow'));
    }

    function addMultiFeatureContextMenuItems(menu, selectedCount) {
        let suppressInfo = getSuppressionMenuInfo();
        let selectedItems = getContextFeatureItems();
        let allGroups = selectedItems.length > 0 && selectedItems.every(item => item.getAttribute('data-type') == 'GROUP');
        let anyGroups = selectedItems.some(item => item.getAttribute('data-type') == 'GROUP');

        addContextMenuItem(menu, menuIcon('create-selection-set'), 'Create Selection Set', () => executeFusionFeatureCommand('CreateSelectionGroupCmd'));
        addContextMenuSeparator(menu);
        addContextMenuItem(menu, menuIcon('configure'), 'Configure', () => executeFusionFeatureCommand('ConfigureFeatureCmd'), '', true);
        addContextMenuSeparator(menu);
        if (allGroups) {
            addContextMenuItem(menu, menuIcon('ungroup'), 'Ungroup', ungroupSelectedGroups);
        } else {
            addContextMenuItem(menu, menuIcon('create-group'), 'Create Group', groupSelectedFeatures, '', anyGroups);
        }
        addContextMenuSeparator(menu);
        addContextMenuItem(menu, menuIcon('delete'), 'Delete', () => executeFusionFeatureCommand('FusionDeleteCommand'), 'Del');
        addContextMenuItem(menu, '', 'Rename', renameContextFeature);
        addContextMenuSeparator(menu);
        addContextMenuItem(menu, menuIcon('roll-marker'), 'Roll Timeline Marker Here', rollContextFeature);
        addContextMenuItem(menu, menuIcon('convert-dm'), 'Convert to DM Feature', () => executeFusionFeatureCommand('ConvertToDMFeatureCommand'), '', anyGroups);
        addContextMenuItem(menu, '', suppressInfo.label, () => setContextFeaturesSuppressed(suppressInfo.suppressed), '', allGroups);
    }

    function addGroupContextMenuItems(menu, item) {
        addContextMenuItem(menu, '', 'Rename Group', renameContextFeature);
        addContextMenuSeparator(menu);
        addContextMenuItem(menu, menuIcon('roll-marker'), 'Roll Timeline Marker Here', rollContextFeature);
        addContextMenuSeparator(menu);
        addContextMenuItem(menu, menuIcon('ungroup'), 'Ungroup', ungroupSelectedGroups);
    }

    function addContextMenuItem(menu, icon, label, action, shortcut='', disabled=false) {
        let item = document.createElement('div');
        item.classList.add('context-menu-item');
        if (disabled) {
            item.classList.add('disabled');
        }

        let iconElement = document.createElement('span');
        iconElement.classList.add('context-menu-icon');
        if (icon) {
            let iconImage = document.createElement('img');
            iconImage.src = icon;
            iconImage.alt = '';
            iconElement.appendChild(iconImage);
        }

        let labelElement = document.createElement('span');
        labelElement.innerText = label;

        let shortcutElement = document.createElement('span');
        shortcutElement.classList.add('context-menu-shortcut');
        shortcutElement.innerText = shortcut;

        item.appendChild(iconElement);
        item.appendChild(labelElement);
        item.appendChild(shortcutElement);

        if (!disabled && action) {
            item.addEventListener('click', (event) => {
                action();
                hideContextMenu();
                event.stopPropagation();
            });
        }
        menu.appendChild(item);
    }

    function addContextMenuSeparator(menu) {
        let separator = document.createElement('div');
        separator.classList.add('context-menu-separator');
        menu.appendChild(separator);
    }

    function hideContextMenu() {
        let menu = document.getElementById('context-menu');
        menu.classList.remove('visible');
        if (contextMenuFeature) {
            contextMenuFeature.classList.remove('context-menu-source');
        }
        contextMenuFeature = null;
    }

    function isContextMenuVisible() {
        return document.getElementById('context-menu').classList.contains('visible');
    }

    function getContextFeatureId() {
        return parseInt(contextMenuFeature.getAttribute('data-id'));
    }

    function getContextFeatureIds() {
        let ids = getSelectedFeatureIds();
        if (ids.length == 0 && contextMenuFeature) {
            ids = [getContextFeatureId()];
        }
        return ids;
    }

    function getContextFeatureItems() {
        let ids = new Set(getContextFeatureIds().map(id => String(id)));
        return getFeatureItems().filter(item => ids.has(item.getAttribute('data-id')));
    }

    function getContextFeatureIcon() {
        if (!contextMenuFeature) {
            return '';
        }
        let image = contextMenuFeature.querySelector('.icon');
        return image ? image.src : '';
    }

    function menuIcon(name) {
        return menuIcons[name] || '';
    }

    function isSketchItem(item) {
        return item.getAttribute('data-type') == 'Sketch';
    }

    function featureSupportsProfileSketch(item) {
        let profileFeatureTypes = new Set([
            'EmbossFeature',
            'ExtrudeFeature',
            'HoleFeature',
            'LoftFeature',
            'RevolveFeature',
            'RibFeature',
            'SweepFeature',
            'WebFeature'
        ]);
        return profileFeatureTypes.has(item.getAttribute('data-type'));
    }

    function getSuppressionMenuInfo() {
        let selectedItems = getContextFeatureItems().filter(item => item.getAttribute('data-type') != 'GROUP');
        let allSuppressed = selectedItems.length > 0 && selectedItems.every(item => item.getAttribute('data-suppressed') == 'true');
        if (allSuppressed) {
            return { label: 'Unsuppress Features', suppressed: false };
        }
        return { label: 'Suppress Features', suppressed: true };
    }

    function editContextFeature() {
        let ret = query('editFeature', { 'id': getContextFeatureId() });
        processCommands(ret);
    }

    function renameContextFeature() {
        let nameElement = contextMenuFeature.querySelector('.name');
        if (nameElement) {
            nameElement.focus();
            selectElementContents(nameElement);
        }
    }

    function rollContextFeature() {
        let ret = query('rollToFeature', { 'id': getContextFeatureId() });
        processCommands(ret);
    }

    function groupSelectedFeatures() {
        let ret = query('groupSelectedFeatures', { 'ids': getContextFeatureIds() });
        processCommands(ret.slice(1));
    }

    function ungroupSelectedGroups() {
        let ret = query('ungroupSelectedGroups', { 'ids': getContextFeatureIds() });
        processCommands(ret.slice(1));
    }

    function setContextFeaturesSuppressed(suppressed) {
        let ret = query('setFeaturesSuppressed', { 'ids': getContextFeatureIds(), 'suppressed': suppressed });
        processCommands(ret.slice(1));
    }

    function toggleContextGroupCollapsed() {
        let groupList = contextMenuFeature.nextSibling;
        setGroupCollapsed(contextMenuFeature, groupList, !isGroupCollapsed(contextMenuFeature));
    }

    function isGroupCollapsed(item) {
        return item.getAttribute('data-collapsed') == 'true';
    }

    function setGroupCollapsed(item, groupList, collapsed) {
        if (collapsed) {
            collapsedGroups.add(item.getAttribute('data-name'));
        } else {
            collapsedGroups.delete(item.getAttribute('data-name'));
        }
        renderGroupCollapsedState(item.getAttribute('data-id'), collapsed);

        let ret = query('setGroupCollapsed', {
            'id': parseInt(item.getAttribute('data-id')),
            'collapsed': collapsed
        });
        processCommands(ret.slice(1));
        renderGroupCollapsedState(item.getAttribute('data-id'), collapsed);
    }

    function renderGroupCollapsedState(id, collapsed) {
        let item = document.querySelector(`.feature[data-id="${id}"]`);
        if (!item) {
            return;
        }
        let groupList = item.nextSibling;
        item.setAttribute('data-collapsed', collapsed);
        item.classList.toggle('collapsed', collapsed);
        let groupToggle = item.querySelector('.group-toggle');
        if (groupToggle) {
            groupToggle.classList.toggle('collapsed', collapsed);
            let toggleImage = groupToggle.querySelector('img');
            if (toggleImage) {
                toggleImage.src = collapsed ? item.getAttribute('data-collapsed-image') : item.getAttribute('data-expanded-image');
            }
        }
        if (groupList) {
            groupList.classList.toggle('collapsed', collapsed);
        }
    }

    function executeFusionFeatureCommand(commandId) {
        let ret = query('executeFeatureCommand', { 'ids': getContextFeatureIds(), 'command-id': commandId });
        processCommands(ret.slice(1));
    }

    function onMarkerMouseDown(e) {
        draggingMarker = true;
        document.body.classList.add('dragging-history-marker');
        setActiveMarkerDropZone(e.target.closest('.marker-drop-zone'));
        document.addEventListener('mousemove', onMarkerMouseMove);
        document.addEventListener('mouseup', onMarkerMouseUp);
        e.preventDefault();
        e.stopPropagation();
    }

    function onMarkerMouseMove(e) {
        if (!draggingMarker) {
            return;
        }
        let zone = getMarkerDropZoneAtPoint(e.clientY);
        setActiveMarkerDropZone(zone);
        if (zone) {
            renderTimelineAtMarkerPosition(parseInt(zone.getAttribute('data-position')));
        }
        e.preventDefault();
        e.stopPropagation();
    }

    function onMarkerMouseUp(e) {
        if (!draggingMarker) {
            return;
        }
        finishMarkerDrag(getMarkerDropZoneAtPoint(e.clientY) || activeMarkerDropZone);
        e.preventDefault();
        e.stopPropagation();
    }

    function finishMarkerDrag(zone) {
        draggingMarker = false;
        document.body.classList.remove('dragging-history-marker');
        document.removeEventListener('mousemove', onMarkerMouseMove);
        document.removeEventListener('mouseup', onMarkerMouseUp);

        if (zone) {
            setMarkerPosition(parseInt(zone.getAttribute('data-position')));
        }

        setActiveMarkerDropZone(null);
    }

    function onFeatureMouseDown(e) {
        if (pendingFeatureDrag || draggedFeatureId !== null) {
            finishFeatureDrag();
        }
        if (draggingMarker || e.button != 0 || e.target.closest('.group-toggle')) {
            return;
        }
        let item = e.target.closest('.feature');
        if (!item) {
            return;
        }
        pendingFeatureDrag = {
            id: parseInt(item.getAttribute('data-id')),
            item: item,
            startX: e.clientX,
            startY: e.clientY
        };
        document.addEventListener('mousemove', onFeatureMouseMove);
        document.addEventListener('mouseup', onFeatureMouseUp);
    }

    function onFeatureMouseMove(e) {
        if (!pendingFeatureDrag && draggedFeatureId === null) {
            return;
        }
        if (draggedFeatureId === null) {
            let dx = Math.abs(e.clientX - pendingFeatureDrag.startX);
            let dy = Math.abs(e.clientY - pendingFeatureDrag.startY);
            if (dx < 3 && dy < 3) {
                return;
            }
            draggedFeatureId = pendingFeatureDrag.id;
            draggedFeatureItem = pendingFeatureDrag.item;
            draggedFeatureItem.classList.add('drag-source');
            document.body.classList.add('dragging-feature');
        }
        let zone = getMarkerDropZoneAtPoint(e.clientY);
        setActiveMarkerDropZone(zone);
        e.preventDefault();
        e.stopPropagation();
    }

    function onFeatureMouseUp(e) {
        let zone = activeMarkerDropZone;
        if (draggedFeatureId !== null && zone) {
            reorderFeature(draggedFeatureId, parseInt(zone.getAttribute('data-position')));
            suppressNextFeatureClick = true;
        }
        finishFeatureDrag();
        e.preventDefault();
        e.stopPropagation();
    }

    function finishFeatureDrag() {
        document.removeEventListener('mousemove', onFeatureMouseMove);
        document.removeEventListener('mouseup', onFeatureMouseUp);
        document.body.classList.remove('dragging-feature');
        clearDragOverMarkers();
        if (draggedFeatureItem) {
            draggedFeatureItem.classList.remove('drag-source');
        }
        pendingFeatureDrag = null;
        draggedFeatureId = null;
        draggedFeatureItem = null;
        setActiveMarkerDropZone(null);
    }

    function reorderFeature(featureId, beforePosition) {
        clearDragOverMarkers();
        document.body.classList.remove('dragging-feature');
        let ret = query('reorderFeature', { 'id': featureId, 'before-position': beforePosition });
        processCommands(ret);
        clearDragOverMarkers();
    }

    function clearDragOverMarkers() {
        for (const zone of document.querySelectorAll('.marker-drop-zone.drag-over')) {
            zone.classList.remove('drag-over');
        }
    }

    function getMarkerDropZoneAtPoint(clientY) {
        let zones = Array.from(document.querySelectorAll('.marker-drop-zone'));
        if (zones.length == 0) {
            return null;
        }

        let closestZone = zones[0];
        let closestDistance = Infinity;
        for (const zone of zones) {
            let rect = zone.getBoundingClientRect();
            let centerY = rect.top + rect.height / 2;
            let distance = Math.abs(centerY - clientY);
            if (distance < closestDistance) {
                closestZone = zone;
                closestDistance = distance;
            }
        }
        return closestZone;
    }

    function setActiveMarkerDropZone(zone) {
        if (activeMarkerDropZone == zone) {
            return;
        }
        if (activeMarkerDropZone) {
            activeMarkerDropZone.classList.remove('drag-over');
        }
        activeMarkerDropZone = zone;
        if (activeMarkerDropZone) {
            activeMarkerDropZone.classList.add('drag-over');
        }
    }

    function onMarkerDragOver(e) {
        if (!draggingMarker && draggedFeatureId === null) {
            return;
        }
        e.preventDefault();
        e.currentTarget.classList.add('drag-over');
        e.dataTransfer.dropEffect = 'move';
    }

    function onMarkerDragLeave(e) {
        e.currentTarget.classList.remove('drag-over');
    }

    function onMarkerDrop(e) {
        if (!draggingMarker && draggedFeatureId === null) {
            return;
        }
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over');
        if (draggedFeatureId !== null) {
            reorderFeature(draggedFeatureId, parseInt(e.currentTarget.getAttribute('data-position')));
        } else {
            setMarkerPosition(parseInt(e.currentTarget.getAttribute('data-position')));
        }
    }

    function setMarkerPosition(position) {
        let ret = query('setMarkerPosition', { 'position': position });
        let succeeded = ret[0] === true;
        processCommands(ret.slice(1));
        if (succeeded) {
            renderTimelineAtMarkerPosition(position);
        }
    }

    function renderTimelineAtMarkerPosition(position) {
        if (lastTimelineData) {
            lastTimelineData['marker-position'] = position;
            handle('setTimeline', lastTimelineData);
        }
    }

    function storeFeatureName(item) {
        let nameElement = item.querySelector('.name');
        let value = nameElement.innerText;
        let hasEditName = item.hasAttribute('data-edit-name');

        let editableName = (hasEditName ? 'data-edit-name' : 'data-name')

        let ret = [];
        if (value != item.getAttribute(editableName)) {
            // Value changed
            ret = query('setFeatureName', { 'id': parseInt(item.getAttribute('data-id')),
                                            'value': value });
            visibleName = ret[0];
            if (visibleName) {
                // Store updated name
                item.setAttribute(editableName, value);
                // Show the visible name
                nameElement.innerText = visibleName;
            } else {
                // Name was not updated
                nameElement.innerText = item.getAttribute('data-name');
            }
        }

        processCommands(ret.slice(1));
    }

    function processCommands(commands) {
        if (!commands) {
            return;
        }
        for (let command of commands) {
            if (!command || typeof command !== 'object' || !command['action']) {
                continue;
            }
            handle(command['action'], command['data']);
        }
    }

    function send(action, data = {}) {
        let commands = query(action, data);
        processCommands(commands);
    }

    function query(action, data = {}) {
        let ret = adsk.fusionSendData(action, JSON.stringify(data));
        console.log("RET:", ret);
        return JSON.parse(ret);        
    }

    function waitForSdk() {
        if (typeof adsk !== 'undefined' && adsk.fusionSendData) {
            ready();
        } else {
            console.log("Waiting for SDK");
            setTimeout(waitForSdk, 500);
        }
    }

    function ready(){
        if (readySent) {
            return;
        }
        readySent = true;
        console.log("HTML ready");
        send('ready');
    }

    document.addEventListener('click', hideContextMenu);
    document.addEventListener('contextmenu', (e) => {
        if (!e.target.closest('.feature') && !e.target.closest('.context-menu')) {
            hideContextMenu();
        }
    });
    document.addEventListener('keydown', (e) => {
        if (e.key == 'Escape') {
            hideContextMenu();
            if (pendingFeatureDrag || draggedFeatureId !== null) {
                finishFeatureDrag();
            }
        }
    });
    window.addEventListener('blur', () => {
        hideContextMenu();
        if (pendingFeatureDrag || draggedFeatureId !== null) {
            finishFeatureDrag();
        }
    });
    document.addEventListener('mouseleave', () => {
        if (pendingFeatureDrag || draggedFeatureId !== null) {
            finishFeatureDrag();
        }
    });
    document.addEventListener('DOMContentLoaded', waitForSdk);
    window.addEventListener('load', waitForSdk);
    waitForSdk();
    console.log("script end");
    </script>
</html>
