# Project-scoped Codex configuration.
#
# Codex loads project `.codex/config.toml` files only for trusted projects.
# The Codex CLI and VS Code IDE extension share this configuration.

[mcp_servers.fusion_mcp_server]
url = "http://127.0.0.1:27182/mcp"
enabled = true
required = false
tool_timeout_sec = 120

